name: Process Family Travel Provider Feed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'travel/provider-feed.json'
      - 'travel/config.json'
      - 'travel/destination_whitelist.json'
      - 'travel/index.html'
      - 'travel/collector.py'
      - 'monitor.py'
      - '.github/workflows/travel-monitor.yml'

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: family-travel-feed-processor
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect live provider feed, validate, persist history, detect 30% drops, build dashboard data
        run: python monitor.py

      - name: Commit processed data, feed and history
        run: |
          git config user.name "travel-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add travel/data.json travel/history.jsonl travel/provider-feed.json
          if git diff --cached --quiet; then
            echo "No processed data changes"
          else
            git commit -m "chore(travel): process live provider feed"
            git push
          fi

      - name: Create or update GitHub alert issue and notify owner
        if: hashFiles('travel/alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '@yanivsa'
            echo
            cat travel/alert.md
          } > /tmp/travel-alert-notify.md

          EXISTING=$(gh issue list --state open --search 'Sukkot 30% Price Drop in:title' --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/travel-alert-notify.md
          else
            gh issue create \
              --title "Sukkot 30% Price Drop" \
              --body-file /tmp/travel-alert-notify.md \
              --assignee yanivsa
          fi

  deploy-pages:
    needs: process
    if: ${{ needs.process.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Prepare current processed site
        run: |
          mkdir -p _site
          cp travel/index.html _site/index.html
          cp travel/data.json _site/data.json
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Live provider collection must be independently verified; this workflow never treats a green processor as proof of full-market live coverage.
# Verified 30%+ drops notify the owner through an assigned @mention GitHub issue. Email delivery requires GitHub Participating/@mentions notifications to be set to Email.
