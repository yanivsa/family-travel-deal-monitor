name: Process Family Travel Provider Feed

on:
  workflow_dispatch:
    inputs:
      email_test:
        description: 'Send a Gmail OAuth2 delivery TEST'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'travel/provider-feed.json'
      - 'travel/config.json'
      - 'travel/destination_whitelist.json'
      - 'monitor.py'
      - 'scripts/send_gmail_alert.py'
      - '.github/workflows/travel-monitor.yml'

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: family-travel-feed-processor
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate feed, persist component history, detect 30% drops, build dashboard data
        run: python monitor.py

      - name: Send Gmail OAuth2 delivery TEST
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.email_test }}
        env:
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python scripts/send_gmail_alert.py --test

      - name: Send Gmail OAuth2 alert for verified 30%+ price drop
        id: gmail_alert
        if: ${{ hashFiles('travel/alert.md') != '' && !(github.event_name == 'workflow_dispatch' && inputs.email_test) }}
        continue-on-error: true
        env:
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python scripts/send_gmail_alert.py --alert travel/alert.md

      - name: Record Gmail OAuth2 delivery failure in alert evidence
        if: ${{ steps.gmail_alert.outcome == 'failure' }}
        run: |
          printf '\n\n⚠️ Gmail OAuth2 delivery failed in GitHub Actions. Check OAuth client/refresh-token secrets and workflow logs. Dashboard/history processing continued.\n' >> travel/alert.md

      - name: Commit processed data and history
        run: |
          git config user.name "travel-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add travel/data.json travel/history.jsonl
          if git diff --cached --quiet; then
            echo "No processed data changes"
          else
            git commit -m "chore(travel): process live provider feed"
            git push
          fi

      - name: Create or update GitHub alert issue
        if: hashFiles('travel/alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --state open --search 'Sukkot 30% Price Drop in:title' --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file travel/alert.md
          else
            gh issue create --title "Sukkot 30% Price Drop" --body-file travel/alert.md
          fi

  deploy-pages:
    needs: process
    if: ${{ needs.process.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Prepare current processed site
        run: |
          mkdir -p _site
          cp travel/index.html _site/index.html
          cp travel/data.json _site/data.json
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Live provider collection must be independently verified; this workflow never treats a green processor as proof of full-market live coverage.
# Gmail production delivery uses OAuth2 with gmail.send only and is complete only after workflow_dispatch(email_test=true) succeeds E2E.
