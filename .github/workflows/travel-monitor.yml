name: Hourly Family Travel Monitor

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: family-travel-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run monitor
        env:
          TRAVEL_PROVIDER_JSON_URL: ${{ secrets.TRAVEL_PROVIDER_JSON_URL }}
          WORLD_AIRFARES_API_KEY: ${{ secrets.WORLD_AIRFARES_API_KEY }}
          WORLD_AIRFARES_ENDPOINT: ${{ secrets.WORLD_AIRFARES_ENDPOINT }}
          BOOKING_COM_API_KEY: ${{ secrets.BOOKING_COM_API_KEY }}
          BOOKING_COM_ENDPOINT: ${{ secrets.BOOKING_COM_ENDPOINT }}
          SKYSCANNER_API_KEY: ${{ secrets.SKYSCANNER_API_KEY }}
          SKYSCANNER_ENDPOINT: ${{ secrets.SKYSCANNER_ENDPOINT }}
          EDREAMS_API_KEY: ${{ secrets.EDREAMS_API_KEY }}
          EDREAMS_ENDPOINT: ${{ secrets.EDREAMS_ENDPOINT }}
          BRECKENWANDER_API_KEY: ${{ secrets.BRECKENWANDER_API_KEY }}
          BRECKENWANDER_ENDPOINT: ${{ secrets.BRECKENWANDER_ENDPOINT }}
        run: python monitor.py
      - name: Commit refreshed data
        run: |
          git config user.name "travel-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add travel/data.json travel/history.jsonl
          if git diff --cached --quiet; then
            echo "No verified data changes"
          else
            git commit -m "chore(travel): hourly refresh"
            git push
          fi
      - name: Notify on meaningful change
        if: hashFiles('travel/alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --state open --search 'Travel Deal Alert in:title' --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file travel/alert.md
          else
            gh issue create --title "Travel Deal Alert" --body-file travel/alert.md
          fi
