name: Travel Monitor CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'monitor.py'
      - 'travel/config.json'
      - 'travel/destination_whitelist.json'
      - 'travel/skills.json'
      - 'tests/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run contract tests
        run: pytest -q
