name: Sync Travel Skills

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
  push:
    paths:
      - 'travel/skills.json'
      - 'scripts/sync_travel_skills.py'
      - '.github/workflows/sync-travel-skills.yml'

permissions:
  contents: write

concurrency:
  group: sync-travel-skills
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync upstream SKILL.md files
        run: python scripts/sync_travel_skills.py
      - name: Commit synced skills
        run: |
          git config user.name "travel-skill-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .agents/skills
          if git diff --cached --quiet; then
            echo "Skills already current"
          else
            git commit -m "chore(travel): sync upstream skills"
            git push
          fi
