<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Travel Deal Monitor</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f6f7fb;color:#111}.wrap{max-width:1100px;margin:auto;padding:24px}h1{margin-bottom:6px}.meta{color:#666;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;border-radius:16px;padding:18px;box-shadow:0 4px 20px rgba(0,0,0,.07)}.badge{font-size:.8rem;font-weight:700}.price{font-size:1.8rem;font-weight:800;margin:10px 0}.score{font-weight:700}.muted{color:#666}.links a{margin-left:10px}table{width:100%;border-collapse:collapse}td{padding:5px 0;border-bottom:1px solid #eee}</style></head><body><div class="wrap"><h1>דילים משפחתיים — סוכות 2026</h1><div id="meta" class="meta">טוען נתונים…</div><div id="grid" class="grid"></div></div><script>async function load(){const r=await fetch('data.json?'+Date.now());const d=await r.json();document.getElementById('meta').textContent=`עודכן: ${d.checked_at} · ${d.status||''}`;const g=document.getElementById('grid');g.innerHTML='';for(const x of d.deals){const c=document.createElement('div');c.className='card';c.innerHTML=`<div class="badge">${x.category}</div><h2>${x.destination}</h2><div>${x.dates}</div><div class="price">₪${Number(x.total_ils).toLocaleString('he-IL')}</div><table><tr><td>טיסה</td><td>${x.flight}</td></tr><tr><td>מלון</td><td>${x.hotel}</td></tr><tr><td>ניצול ימים</td><td>${x.time_value}</td></tr><tr><td>שעות אפקטיביות</td><td>${x.effective_vacation_hours}</td></tr><tr><td>Family Value</td><td class="score">${x.family_value}/100</td></tr></table><p>${x.why||''}</p><div class="links"><a href="${x.flight_url}" target="_blank">טיסה</a><a href="${x.hotel_url}" target="_blank">מלון</a></div>`;g.appendChild(c)}}load().catch(e=>document.getElementById('meta').textContent='שגיאה בטעינת הנתונים: '+e);</script></body></html>
