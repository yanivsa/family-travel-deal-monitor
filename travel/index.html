<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family Travel Deal Monitor — Sukkot 2026</title>
<style>
:root{font-family:Arial,sans-serif;color:#172033;background:#f5f7fb}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:24px}.hero,.panel,.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 8px 28px #17203312}.hero{padding:22px;margin-bottom:18px}.hero h1{margin:0 0 8px;font-size:28px}.muted{color:#667085}.status{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pill{background:#eef2ff;border-radius:999px;padding:7px 11px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}.tag{font-weight:700;font-size:13px;color:#475467}.dest{font-size:22px;font-weight:800;margin:8px 0}.total{font-size:30px;font-weight:900;margin:12px 0}.line{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #eef0f3}.line:last-child{border:0}.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.btn{display:inline-block;text-decoration:none;background:#172033;color:#fff;padding:9px 13px;border-radius:10px}.btn.secondary{background:#eef2f6;color:#172033}.warn{margin-top:16px;background:#fff8e7;padding:12px;border-radius:12px}.alert{background:#fff1f1;border:1px solid #ffc7c7;margin-bottom:16px}.ok{color:#067647}.bad{color:#b42318}.providers{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.provider{padding:9px 11px;background:#f8fafc;border-radius:10px;font-size:13px}.footer{margin:20px 0;color:#667085;font-size:13px}@media(max-width:850px){.grid,.providers{grid-template-columns:1fr}.wrap{padding:14px}.hero h1{font-size:24px}}
</style>
</head>
<body><div class="wrap">
<section class="hero">
<h1>מוניטור נפילות מחיר משפחתי — סוכות 2026</h1>
<div id="scope" class="muted">טוען את היקף החיפוש העדכני…</div>
<div id="status" class="status"></div>
</section>
<div id="alerts"></div>
<section class="panel"><b>כיסוי הסריקה והספקים</b><div id="coverage" class="muted" style="margin-top:8px"></div><div id="providers" class="providers"></div></section>
<div id="grid" class="grid"></div>
<div class="warn">התראת PRICE DROP נוצרת רק בירידה מאומתת של 30%+ בטיסה, במלון או בסך החופשה מול היסטוריה השוואתית לאותו חלון. מחיר ראשון ללא היסטוריה מסומן כבסיס חדש ולא כהנחה.</div>
<div id="footer" class="footer"></div>
</div>
<script>
const ils=n=>n==null?'—':new Intl.NumberFormat('he-IL',{style:'currency',currency:'ILS',maximumFractionDigits:0}).format(n);
const safe=v=>v==null?'—':String(v);
const heDate=s=>{if(!s)return '—';const [y,m,d]=String(s).split('-');return `${Number(d)}.${Number(m)}.${y}`};
fetch('./data.json?ts='+Date.now()).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{
 const a=d.automation||{}, c=d.scan_coverage||{}, deals=d.deals||[], alerts=d.price_drop_alerts||[], s=d.search||{};
 const fresh=(c.gateways_fresh_within_90m||c.gateways_live_checked_this_run||[]);
 const current=(c.gateways_live_checked_this_run||[]);
 const returns=(s.return_dates||[]).map((x,i)=>`${heDate(x)}${x==='2026-10-02'&&s.return_2026_10_02_morning_only?' לפני 12:00':''}`).join(' או ');
 const kids=((s.party||{}).children_ages||[]).length;
 document.getElementById('scope').textContent=`${safe((s.party||{}).adults)} מבוגרים + ${kids} ילדים · יציאה ${safe(s.origin)} ב־${heDate(s.departure_date)} · חזרה ${returns||'—'} · ${s.direct_only?'טיסות ישירות בלבד':'טיסות'} · ${safe(c.whitelist_profiles)} יעדים משפחתיים באירופה`;
 document.getElementById('status').innerHTML=`<span class="pill">סטטוס: ${safe(a.status)}</span><span class="pill">מצב: ${safe(a.provider_mode)}</span><span class="pill">אימות חי אחרון: ${safe(a.last_verified_live_refresh)}</span>`;
 document.getElementById('coverage').textContent=`כיסוי טרי ב־90 הדקות האחרונות: ${fresh.length} מתוך ${safe(c.unique_gateways_total)} gateways · בסבב האחרון נבדקו ${current.length} · ${safe(c.whitelist_profiles)} פרופילי יעד. ${safe(c.note)}`;
 document.getElementById('providers').innerHTML=Object.entries(d.provider_health||{}).map(([name,v])=>`<div class="provider"><b>${name}</b> · <span class="${v.status==='ok'?'ok':(v.status==='degraded'?'bad':'')}">${safe(v.status)}</span><br><span class="muted">${safe(v.message)}</span></div>`).join('') || '<div class="muted">אין נתוני provider health.</div>';
 document.getElementById('alerts').innerHTML=alerts.length?`<section class="panel alert"><b>🚨 נמצאו נפילות מחיר של 30%+</b>${alerts.map(x=>`<div class="line"><span>${x.destination} · ${x.component}</span><b>${ils(x.baseline_ils)} → ${ils(x.current_ils)} (−${x.drop_pct}%)</b></div>`).join('')}</section>`:'';
 document.getElementById('grid').innerHTML=deals.length?deals.map(x=>`<article class="card"><div class="tag">${x.rank}. ${safe(x.category)}</div><div class="dest">${safe(x.destination)}</div><div class="muted">${safe(x.departure_date)} → ${safe(x.return_date)} · TLV ↔ ${safe(x.gateway_iata)} · ${x.direct?'ישיר':'לא ישיר'}</div><div class="total">${ils(x.vacation_total_ils)}</div><div class="line"><span>✈️ ${safe(x.airline)}</span><b>${ils(x.flight_total_ils)}</b></div><div class="line"><span>↩️ חזרה</span><b>${safe(x.return_departure_time)}</b></div><div class="line"><span>כבודה</span><b>${safe(x.baggage)}</b></div><div class="line"><span>🏨 ${safe(x.hotel)} ${x.stars?'★'.repeat(Math.round(x.stars)):''}</span><b>${ils(x.hotel_total_ils)}</b></div><div class="line"><span>ציון אורחים</span><b>${safe(x.guest_score)}</b></div><div class="line"><span>חדרים</span><b>${safe(x.rooms)}</b></div>${x.package_total_ils!=null?`<div class="line"><span>חבילה מאומתת</span><b>${ils(x.package_total_ils)}</b></div>`:''}<div class="line"><span>Effective Vacation Time</span><b>${x.effective_vacation_hours!=null?'~'+x.effective_vacation_hours+' שעות':'—'}</b></div><div class="links"><a class="btn" href="${x.flight_url}" target="_blank" rel="noopener">טיסה</a><a class="btn secondary" href="${x.hotel_url}" target="_blank" rel="noopener">מלון</a>${x.package_url?`<a class="btn secondary" href="${x.package_url}" target="_blank" rel="noopener">חבילה</a>`:''}</div></article>`).join(''):'<section class="panel">אין כרגע מועמדים מאומתים שעברו את כל כללי הסינון.</section>';
 document.getElementById('footer').textContent=`דף עובד מנתוני feed מעובדים · עודכן: ${safe(d.generated_at)} · Asia/Jerusalem`;
}).catch(e=>{document.getElementById('grid').innerHTML='<section class="panel">שגיאה בטעינת הנתונים: '+e.message+'</section>'});
</script></body></html>
